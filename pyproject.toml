[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmim"
dynamic = ["version"]
description = "Multi-scale niche covariance for training-free spatial domain identification"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Bairui Du" }, { name = "Hisanori Kiryu" }]
requires-python = ">=3.10"
keywords = ["spatial transcriptomics", "spatial domain", "niche", "covariance", "clustering"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scanpy>=1.10,<1.12",
  "umap-learn<0.5.12",
  "numba>=0.62",
  "anndata>=0.10",
  "igraph>=0.11",
]

[project.optional-dependencies]
metrics = ["squidpy>=1.2,<1.9"]   # Moran's I and Geary's C

[project.urls]
Homepage = "https://github.com/barondu/cosmim"
Repository = "https://github.com/barondu/cosmim"
Issues = "https://github.com/barondu/cosmim/issues"

[tool.setuptools.dynamic]
version = { attr = "cosmim.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
